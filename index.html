<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title, description and favicon are filled from content/*.json -->
  <title>Portfolio</title>
  <meta name="description" content="">
  <link rel="icon" id="favicon" href="data:,">

  <!-- Set the theme before the page paints (prevents a flash) -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    ALL CONTENT LIVES IN THE content/ FOLDER:
      content/text.json      every text on the site
      content/projects.json  your projects
      content/images.json    every image slot
    You don't need to edit this file. Elements with data-text="..."
    get their text from that key in text.json.
  -->

  <!-- Background: 3D particles + soft gradients -->
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Custom cursor (desktop only) -->
  <div class="cursor" aria-hidden="true">
    <span class="cursor__circle"></span>
    <span class="cursor__label"></span>
  </div>

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <a href="#/" class="brand" id="brand">
      <span class="brand__mark" id="brandMark" data-text="person.initials"></span>
      <span class="brand__text"><span data-text="meta.brandName"></span><em data-text="meta.brandSubtitle"></em></span>
    </a>

    <nav class="menu" aria-label="Main">
      <span class="menu__pill" aria-hidden="true"></span>
      <a href="#/" data-nav="home"><span>00</span><b data-text="interface.nav.home"></b></a>
      <a href="#/work" data-nav="work"><span>01</span><b data-text="interface.nav.work"></b></a>
      <a href="#/about" data-nav="about"><span>02</span><b data-text="interface.nav.about"></b></a>
      <a href="#/contact" data-nav="contact"><span>03</span><b data-text="interface.nav.contact"></b></a>
    </nav>

    <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark mode">
      <span class="theme-toggle__label">
        <span class="only-dark" data-text="interface.theme.dark"></span>
        <span class="only-light" data-text="interface.theme.light"></span>
      </span>
      <span class="theme-toggle__track"><span class="theme-toggle__dot"></span></span>
    </button>
  </header>

  <main class="views">

    <!-- ========== HOME ========== -->
    <section class="view view--home" data-view="home" aria-label="Home">
      <div class="home__content">
        <p class="eyebrow reveal" style="--i:0" data-text="home.eyebrow"></p>
        <h1 class="home__title">
          <span class="mask"><span style="--i:1" data-text="person.firstName"></span></span>
          <span class="mask"><span class="gradient-text" style="--i:2" data-text="person.lastName"></span></span>
        </h1>
        <p class="home__intro reveal" style="--i:3">
          <span data-text="home.introBefore"></span>
          <span class="rotator" id="rotator"></span>
          <span data-text="home.introAfter"></span>
        </p>
        <div class="home__actions reveal" style="--i:4">
          <a href="#/work" class="btn btn--primary"><span data-text="home.primaryButton"></span> <span class="btn__arrow">→</span></a>
          <a href="#/about" class="btn btn--ghost" data-text="home.secondaryButton"></a>
        </div>
      </div>

      <!-- Filled from home.facts -->
      <dl class="home__aside reveal" style="--i:5" id="homeFacts"></dl>
    </section>

    <!-- ========== WORK ========== -->
    <section class="view view--work" data-view="work" data-mode="slides" aria-label="Work">
      <div class="work__bar reveal" style="--i:0">
        <p class="eyebrow" data-text="work.eyebrow"></p>
        <div class="switch" role="group" aria-label="Layout">
          <button class="switch__btn is-active" data-mode="slides" aria-pressed="true" data-text="work.layoutSlides"></button>
          <button class="switch__btn" data-mode="grid" aria-pressed="false" data-text="work.layoutGrid"></button>
        </div>
      </div>

      <!-- Filled from content/projects.json -->
      <div class="work__info" id="workInfo" aria-live="polite"></div>
      <div class="work__stage reveal" style="--i:1" id="workStage"></div>

      <div class="work__controls reveal" style="--i:2">
        <button class="round-btn" id="workPrev" aria-label="Previous project"><span>←</span></button>
        <div class="progress" id="workProgress"></div>
        <button class="round-btn" id="workNext" aria-label="Next project"><span>→</span></button>
      </div>

      <div class="work__grid" id="workGrid"></div>
    </section>

    <!-- ========== PROJECT DETAIL (filled by js/main.js) ========== -->
    <section class="view view--project" data-view="project" id="projectView" aria-label="Project"></section>

    <!-- ========== ABOUT ========== -->
    <section class="view view--about" data-view="about" aria-label="About">
      <div class="about__portrait placeholder reveal" style="--i:0" id="portrait" data-label="Portrait"></div>

      <div class="about__text">
        <p class="eyebrow reveal" style="--i:1" data-text="about.eyebrow"></p>
        <h2 class="about__title">
          <span class="mask"><span style="--i:2" data-text="about.titleLine1"></span></span>
          <span class="mask"><span class="gradient-text" style="--i:3" data-text="about.titleLine2"></span></span>
        </h2>
        <p class="about__intro reveal" style="--i:4" data-text="about.intro"></p>

        <!-- Filled from about.columns -->
        <div class="about__cols reveal" style="--i:5" id="aboutCols"></div>
      </div>
    </section>

    <!-- ========== CONTACT ========== -->
    <section class="view view--contact" data-view="contact" aria-label="Contact">
      <p class="badge reveal" style="--i:0" id="contactBadge"><span class="badge__dot"></span><span data-text="contact.badge"></span></p>

      <h2 class="contact__title">
        <span class="mask"><span style="--i:1" data-text="contact.titleLine1"></span></span>
        <span class="mask"><span class="gradient-text" style="--i:2" data-text="contact.titleLine2"></span></span>
      </h2>

      <div class="contact__row reveal" style="--i:3">
        <a href="#" class="contact__mail" id="contactMail" data-text="person.email"></a>
        <button class="btn btn--ghost btn--sm" id="copyMail" data-text="contact.copyButton"></button>
      </div>

      <!-- Filled from contact.socials -->
      <ul class="contact__links reveal" style="--i:4" id="contactLinks"></ul>
    </section>

  </main>

  <!-- ========== STATUS BAR ========== -->
  <footer class="statusbar">
    <span class="status__view"><span class="status__dot"></span><span id="statusView"></span></span>
    <span class="status__hints" id="statusHints"></span>
    <span class="status__time"><span data-text="interface.statusLocation"></span> · <time id="clock">--:--</time></span>
  </footer>

  <script src="js/particles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
